<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faça Seu Login</title>
    <link rel="shortcut icon" href="imagens/logo.png" type="img-logo">
    <link rel="stylesheet" href="forms.css">
    <script src="https://kit.fontawesome.com/3366136395.js" crossorigin="anonymous"></script>
</head>

<body>
    <main>

        <div class="container">

            <h2>Login</h2>

            <form action="">
                
                <div class="input-group">
                    <label for="email">Login</label>
                    <input type="email" placeholder="Digite seu email" required>
                </div>

                <div class="input-group">
                    <label for="Senha">Senha</label>
                    <input type="password" placeholder="Digite sua senha" required>
                </div>

                <div class="links">
                    <a href="">Esqueci minha senha</a>
                    <a href="">Não tenho cadastro</a>
                  
                </div>

                <input type="submit" class="btn" value="Entrar">

            </form>

            <button class="google-btn">
                <img src="imagens/simbolo-do-google.png" alt="Icon Google">
                Entra com Google
            </button>
        </div>
    </main>
</body>

</html>
